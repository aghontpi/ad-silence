name: Android CI

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          echo "$DEBUG_KEYSTORE" | base64 --decode > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$(pwd)/debug.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Extract Version Name
        id: extract_version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Rename APK
        if: github.event_name == 'pull_request'
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ad-silence-debug-build-${{ env.VERSION_NAME }}-${{ github.event.pull_request.number }}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-silence-debug-build
          path: app/build/outputs/apk/debug/*.apk

      - name: Deploy to builds branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stash the APK
          mkdir -p /tmp/apk_stash
          cp app/build/outputs/apk/debug/*.apk /tmp/apk_stash/
          APK_NAME=$(basename /tmp/apk_stash/*.apk)
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          
          # Clone builds branch to temp dir
          rm -rf /tmp/builds_repo
          git clone --quiet --branch builds https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} /tmp/builds_repo || \
          (mkdir /tmp/builds_repo && cd /tmp/builds_repo && git init && git checkout -b builds && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }})
          
          cd /tmp/builds_repo
          mkdir -p pr-${{ github.event.pull_request.number }}
          cp /tmp/apk_stash/$APK_NAME pr-${{ github.event.pull_request.number }}/
          
          git add .
          git commit -m "Update build for PR #${{ github.event.pull_request.number }}"
          git push origin builds

      - name: Comment Debug APK on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            A debug APK build is available for this pull request.
            
            [Download ad-silence-${{ env.VERSION_NAME }}-debug APK](https://github.com/${{ github.repository }}/raw/builds/pr-${{ github.event.pull_request.number }}/${{ env.APK_NAME }})
